[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "wheel"]

[project]
name = "invenio-subjects-fast"
version = "2026.09.23"
description = "Provides the FAST faceted subject vocabulary for InvenioRDM"
readme = "README.md"
keywords = ["FAST", "invenio", "inveniordm", "subjects"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MESH Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=7",
  "halo>=0.0.31",
  "jsonlines",
  "pymarc>=5.3.1",
  "requests>=2.25.1",
  "tqdm>=4.65",
]
# Local development / packaging / test tools
optional-dependencies.dev = [
  "build",
  "check-manifest",
  "coverage",
  "invenio-app>=2,<3",
  "invenio-jobs>=3,<5",
  "invenio-search[opensearch2]>=3.0.0,<4.0.0",
  "pytest>=7.3.2",
  "pytest-cov>=6.2.1",
  "pytest-invenio>=3.3,<4",
  "pytest-ruff>=0.1",
  "pyyaml>=5.4.1",
  "requests-mock>=1.11",
  "ruff>=0.3",
  "setuptools>=61,<82",
  "twine",
  "ty",
  "wheel",
]
urls.Homepage = "https://github.com/MESH-Research/invenio-subjects-fast"
urls.Repository = "https://github.com/MESH-Research/invenio-subjects-fast"
scripts.invenio-subjects-fast = "invenio_subjects_fast.cli:cli"
entry-points."flask.commands".subjects_fast = "invenio_subjects_fast.cli:cli"
entry-points."invenio_rdm_records.fixtures".invenio_subjects_fast = "invenio_subjects_fast.vocabularies"
entry-points."invenio_celery.tasks".invenio_subjects_fast = "invenio_subjects_fast.tasks"
entry-points."invenio_jobs.jobs".process_fast_subject_updates = "invenio_subjects_fast.jobs:ProcessFastSubjectUpdatesJob"

[dependency-groups]
dev = [
  "build",
  "check-manifest",
  "coverage",
  "invenio-app>=2,<3",
  "invenio-jobs>=3,<5",
  "invenio-search[opensearch2]>=3.0.0,<4.0.0",
  "pytest>=7.3.2",
  "pytest-cov>=6.2.1",
  "pytest-invenio>=3.3,<4",
  "pytest-ruff>=0.1",
  "pyyaml>=5.4.1",
  "requests-mock>=1.11",
  "ruff>=0.3",
  "setuptools>=61,<82",
  "twine",
  "ty",
  "wheel",
]

[tool.setuptools]
package-data.invenio_subjects_fast = [
  "vocabularies/*.jsonl",
  "vocabularies/*.yaml",
  "vocabularies/.gitkeep",
  "vocabularies/updates/.gitkeep",
  "downloads/.gitkeep",
  "downloads/updates/.gitkeep",
  "downloads/updates/processed/.gitkeep",
]
packages.find.include = ["invenio_subjects_fast", "invenio_subjects_fast.*"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = [
  ".venv",
  "invenio_subjects_fast/downloads",
  "invenio_subjects_fast/vocabularies",
  "invenio_subjects_fast/jobs.py",
  "invenio_subjects_fast/tasks.py",
  "tests/data",
]
format.quote-style = "double"
lint.select = ["B", "D", "DOC", "E", "F", "I", "UP"]
lint.ignore = [
  "D412", # Missing blank line before closing docstring
  "W1",   # Indentation warnings
  "W2",   # Whitespace warnings
  "W3",   # Blank line warnings
]
lint.per-file-ignores."__init__.py" = ["D104", "E402", "F401"]
lint.per-file-ignores."tests/**" = ["D", "DOC"]
lint.isort.known-first-party = ["invenio_subjects_fast", "tests"]
lint.pydocstyle.convention = "google"
lint.preview = true

[tool.ty]
analysis = {}
# Type checking with ty (replaces mypy). Mirrors KCWorks [tool.ty] settings;
# paths adapted to this package's layout.
environment.python-version = "3.14"
rules.redundant-cast = "warn"
rules.unused-ignore-comment = "ignore"
rules.unused-type-ignore-comment = "ignore"
rules.unresolved-import = "ignore"
rules.unresolved-global = "ignore"
src.exclude = [
  "tests",
  "invenio_subjects_fast/downloads",
  "invenio_subjects_fast/vocabularies",
]

[tool.check-manifest]
ignore = [".*-requirements.txt", "*.bin", "*.gitkeep", ".venv/**", "uv.lock"]

[tool.pytest]
ini_options.addopts = """
--ruff --doctest-modules
--log-cli-level=DEBUG
--ignore=invenio_subjects_fast/downloads
--ignore=invenio_subjects_fast/vocabularies
--ignore=invenio_subjects_fast/jobs.py
--ignore=invenio_subjects_fast/tasks.py
--ignore=tests/data
--cov=invenio_subjects_fast
--cov-report=term-missing
"""
ini_options.testpaths = ["tests", "invenio_subjects_fast"]
ini_options.pythonpath = ["tests"]
ini_options.log_cli_level = "DEBUG"

[tool.coverage.run]
omit = [
  "invenio_subjects_fast/downloads/*",
  "invenio_subjects_fast/vocabularies/*",
]
